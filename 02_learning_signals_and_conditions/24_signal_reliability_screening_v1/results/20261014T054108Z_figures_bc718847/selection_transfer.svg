  <g id="text_22">
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; fill: #52606d" transform="translate(44.064 435.61125)">A/B/C 동일 가중. 선택·채점 사례 분리. 관측 최상위는 잡음이 있는 참고값이며 true oracle이 아님.</text>
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; fill: #52606d" transform="translate(44.064 447.104531)">선택용 부분집합 2,000회는 독립 RL 반복이 아님. 모든 곡선은 Greedy 선택.</text>
